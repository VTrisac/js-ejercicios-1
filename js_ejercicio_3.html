<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 3 · Lista dinámica</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <a href="index.html">← Índice</a>
    <strong>Ejercicio 3</strong>
  </header>
  <main>
    <section class="card">
      <h1>Lista dinámica</h1>
      <p class="lead">Añade elementos a la lista y elimínalos con su botón.</p>
      <form id="form-lista" class="row">
        <input id="input-item" type="text" placeholder="Escribe un elemento" autocomplete="off">
        <button type="submit">Agregar</button>
      </form>
      <p class="error" id="error-lista"></p>
      <ul class="list" id="lista"></ul>
    </section>
  </main>
  <script src="js_ejercicio3.js"></script>
</body>
</html>
