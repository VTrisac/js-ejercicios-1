<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 7 · Generador de contraseñas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <a href="index.html">← Índice</a>
    <strong>Ejercicio 7</strong>
  </header>
  <main>
    <section class="card">
      <h1>Generador de contraseñas</h1>
      <p class="lead">Genera una contraseña con letras, números y símbolos.</p>
      <form id="form-pass" class="row" novalidate>
        <input id="longitud" type="number" min="4" placeholder="Longitud (mínimo 4)">
        <button type="submit">Generar contraseña</button>
      </form>
      <p class="output" id="password"></p>
      <p class="error" id="error-pass"></p>
    </section>
  </main>
  <script src="js_ejercicio7.js"></script>
</body>
</html>
